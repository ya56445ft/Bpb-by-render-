services:
  - type: web
    name: bpb-worker-panel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WRANGLER_SEND_METRICS
        value: "false"
      - key: DATA_DIR
        value: /data
      - key: VL_UUID
        generateValue: true
      - key: TR_PASS
        generateValue: true
      - key: SECURE_PATH
        generateValue: true
